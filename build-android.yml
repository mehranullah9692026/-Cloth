
name: Build Cloth App APK and AAB

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Find app directory
        id: project
        shell: bash
        run: |
          if [ -f package.json ]; then
            echo "app_dir=." >> "$GITHUB_OUTPUT"
          elif [ -f app/package.json ]; then
            echo "app_dir=app" >> "$GITHUB_OUTPUT"
          else
            echo "package.json not found"
            exit 1
          fi

      - name: Install dependencies
        working-directory: ${{ steps.project.outputs.app_dir }}
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Build web app
        working-directory: ${{ steps.project.outputs.app_dir }}
        run: npm run build --if-present

      - name: Add Android platform if missing
        working-directory: ${{ steps.project.outputs.app_dir }}
        run: |
          if [ ! -d android ]; then
            npx cap add android
          fi

      - name: Sync Capacitor
        working-directory: ${{ steps.project.outputs.app_dir }}
        run: npx cap sync android

      - name: Build APK and AAB
        working-directory: ${{ steps.project.outputs.app_dir }}/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug bundleDebug

      - name: Upload APK and AAB
        uses: actions/upload-artifact@v4
        with:
          name: Cloth-Android-Build
          path: |
            ${{ steps.project.outputs.app_dir }}/android/app/build/outputs/apk/debug/*.apk
            ${{ steps.project.outputs.app_dir }}/android/app/build/outputs/bundle/debug/*.aab
          if-no-files-found: error
